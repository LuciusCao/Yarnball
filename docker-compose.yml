name: tripmapper

services:
  db:
    image: postgres:16-alpine
    container_name: tripmapper-db
    environment:
      POSTGRES_USER: tripmapper
      POSTGRES_PASSWORD: tripmapper
      POSTGRES_DB: tripmapper
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripmapper"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
