name: yarnball

services:
  db:
    image: postgres:16-alpine
    container_name: yarnball-db
    environment:
      POSTGRES_USER: yarnball
      POSTGRES_PASSWORD: yarnball
      POSTGRES_DB: yarnball
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yarnball"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
