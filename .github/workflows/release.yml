name: Release

# 打 tag（v*）触发：先过 ci.yml 同一套质量门（workflow_call 复用，链路单一定义点），
# 再在 macOS runner 打 dmg 附到 GitHub Release。tag 必须与 tauri.conf.json 的 version
# 一致（去 v 前缀，如 v0.1.0 ↔ 0.1.0），否则校验步红掉，防止错版发布。
on:
  push:
    tags: ['v*']

jobs:
  # 质量门：与 CI / 本地 `pnpm verify` 完全同一条链路（build + smoke）
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    # macos-latest = arm64 runner：产物为 aarch64 dmg（Apple Silicon）。
    # x86_64 dmg 需要 GitHub 付费 x64 runner 或交叉编译改造，v1 不做。
    runs-on: macos-latest
    permissions:
      contents: write # 创建 GitHub Release 并上传 dmg
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup 从 package.json 的 packageManager 字段读取版本（pnpm@10）
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri

      # 两处版本号必须同时与 tag 对齐：tauri.conf.json（dmg 文件名/壳版本）与
      # apps/server/package.json（/healthz 下发的 version，壳靠它核对 sidecar 身份之外
      # 的版本信息，用户排障也看它）。改一处漏另一处时在此红灯拦下。
      - name: 校验 tag 与应用版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          conf="$(jq -r .version apps/tauri/src-tauri/tauri.conf.json)"
          srv="$(jq -r .version apps/server/package.json)"
          if [ "$tag" != "$conf" ] || [ "$srv" != "$conf" ]; then
            echo "版本号不一致：tag=$tag tauri.conf.json=$conf apps/server/package.json=$srv；请先对齐再打 tag" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      # 与本地 just package / pnpm tauri:package 同链路：
      # build:sidecar（Node SEA）→ tauri build（dmg，含 web 构建 + splash 注入 + ad-hoc 封印）
      # → verify:sign（codesign --verify --deep --strict 防回归，见 scripts/verify-sign.mjs）→ copy:dmg
      - name: 打包 dmg
        run: pnpm -C apps/tauri package

      # 防回归门槛：对 bundle/macos 与 dmg 内的 .app 跑 codesign --verify --deep --strict，
      # 封印断裂（如历史上 linker-signed 导致的「已损坏」误报）直接 fail 整个 release。
      # 同时断言 sidecar 不带未配 entitlements 的 hardened runtime flag（M106 根因，
      # 见 scripts/verify-sign.mjs）。
      # ad-hoc 签名本就会被 spctl 拒绝（无 Developer ID），故 spctl 只作信息项、不卡门槛。
      - name: 校验签名封印
        run: pnpm -C apps/tauri verify:sign

      # sidecar 启动烟（M106）：签名再对也查不出「运行时崩溃」——hardened runtime 杀
      # Node SEA sidecar 时用户看到的是首启卡 splash（壳等 healthz 超时）。这里从 dmg
      # 拷出 .app，注入壳同款 env 直跑 sidecar，断言 /healthz 返回 ok+app:yarnball
      # +webStatic:true，不过则 fail 整个 release（scripts/smoke-sidecar.mjs）。
      - name: sidecar 启动烟
        run: pnpm -C apps/tauri smoke:sidecar

      - name: 列出产物
        run: ls -lh dist/

      # GitHub 资产名会削掉 CJK 字符（毛线团_0.1.0_aarch64.dmg → _0.1.0_aarch64.dmg），
      # 上传前换成 ASCII 前缀：Yarnball_0.1.0_aarch64.dmg
      - name: 重命名为 ASCII 文件名
        run: |
          cd dist
          for f in *.dmg; do mv "$f" "Yarnball_${f#*_}"; done
          ls -lh

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          # v0.2.0-beta.1 这类带 - 后缀的 tag 自动标记 prerelease
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            macOS（Apple Silicon / aarch64）桌面版。

            未做 Developer ID 签名与公证（ad-hoc 封印，已通过 codesign --verify --deep --strict 校验与 sidecar 启动烟）：
            首次打开若被 Gatekeeper 拦截，请右键 App →「打开」，或在「系统设置 → 隐私与安全性」点「仍要打开」。

            环境变量与 agent CLI 配置见仓库 README。
