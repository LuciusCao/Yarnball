[package]
name = "yarnball"
version = "0.1.0"
description = "毛线团（Yarnball）桌面壳"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "yarnball_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
# M104 壳内「保存为 PDF」：直调 WKWebView printOperation 静默写盘（无打印面板）。
# 四个 crate 均已在依赖树中（wry 的 macOS 依赖，版本锁定一致），仅开启所需 feature，无额外编译成本。
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSDictionary", "NSObject"] }
objc2-app-kit = { version = "0.3", features = ["NSPrintInfo", "NSPrintOperation"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "objc2-app-kit"] }
tokio = { version = "1", features = ["signal", "macros"] }
ureq = "3"
serde_json = "1"

[profile.release]
panic = "abort"
lto = true
opt-level = "s"
